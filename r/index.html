<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0F0E">
<title>Nimo — Responder recado</title>
<link rel="icon" type="image/png" href="../assets/icone.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nimo">
<meta property="og:title" content="Tem um recado esperando sua resposta no Nimo">
<meta property="og:description" content="Toque para responder. Grátis, sem e-mail e sem telefone.">
<meta property="og:image" content="https://chatnimo.com/assets/capa.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#11392D 0%,#0B0F0E 60%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
  main{width:100%;max-width:420px;padding:34px 22px 28px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .marca{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
  .marca img{width:40px;height:40px;border-radius:12px}
  .quem{display:flex;flex-direction:column;align-items:center;gap:8px}
  .avatar{width:64px;height:64px;border-radius:50%;background:#F4B183;color:#3A2312;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .nome{font-size:18px;font-weight:700;text-align:center}
  .balao{width:100%;background:#fff;color:#0B0F0E;border-radius:24px 24px 24px 8px;padding:22px;font-size:22px;line-height:1.3;font-weight:800;overflow-wrap:anywhere;white-space:pre-line}
  .balao.fora{background:#131B19;color:#E3EAE7;font-size:17px;font-weight:600}
  .botao{width:100%;height:58px;border-radius:16px;background:#2EE6A8;color:#06231A;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;text-decoration:none}
  .ja{color:#2EE6A8;font-size:14px;font-weight:600}
  .passos{width:100%;background:#131B19;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:#E3EAE7}
  .passos b{color:#A8B4B0;font-size:12px;letter-spacing:.8px}
  small{color:#8A9692;font-size:11px;text-align:center;line-height:1.5}
  [dir=rtl] .balao{border-radius:24px 24px 8px 24px}
</style>
</head>
<body>
<main>
  <div class="marca"><img src="../assets/icone.png" alt=""><span>Nimo</span></div>
  <div class="quem" id="quem" hidden>
    <div class="avatar" id="inicial"></div>
    <div class="nome" id="nome"></div>
  </div>
  <div class="balao" id="texto"></div>

  <a class="botao" id="botao" href="https://play.google.com/store/apps/details?id=com.leonardomondaine.nimo"></a>
  <a class="ja" id="ja" href="#" hidden></a>

  <div class="passos">
    <b id="como"></b>
    <span id="p1"></span>
    <span id="p2"></span>
    <span id="p3"></span>
  </div>
  <small id="idade"></small>
</main>
<script>
(function () {
  // Recado compartilhável (nov/2026). O texto do recado vem do servidor
  // (recadoPublico) e só aparece se o próprio autor compartilhou e o recado
  // ainda está no ar. Nada daqui é escrito como HTML: só textContent.
  var PACOTE = 'com.leonardomondaine.nimo';
  var BASE = 'https://southamerica-east1-nimo---chat.cloudfunctions.net/';

  var T = {
    pt: { gen: 'Tem um recado esperando sua resposta no Nimo.', deixou: '{nome} deixou um recado', botao: 'Responder no Nimo', ja: 'Já tenho o Nimo — abrir no app', como: 'COMO FUNCIONA', p1: '1. Instale o Nimo grátis', p2: '2. Escolha um apelido, sem e-mail nem telefone', p3: '3. O app abre direto no recado', fora: 'Esse recado já saiu do ar, mas tem muita gente no Mural do Nimo esperando conversa.', botaoFora: 'Conhecer o Nimo', idade: 'Só para maiores de 18 anos. O recado some em 24 horas.' },
    en: { gen: 'A note is waiting for your reply on Nimo.', deixou: '{nome} left a note', botao: 'Reply on Nimo', ja: 'I already have Nimo — open the app', como: 'HOW IT WORKS', p1: '1. Install Nimo for free', p2: '2. Pick a nickname, no email or phone', p3: '3. The app opens right on the note', fora: 'This note is no longer up, but lots of people on the Nimo Wall are waiting to chat.', botaoFora: 'Get Nimo', idade: '18+ only. Notes disappear after 24 hours.' },
    es: { gen: 'Hay un mensaje esperando tu respuesta en Nimo.', deixou: '{nome} dejó un mensaje', botao: 'Responder en Nimo', ja: 'Ya tengo Nimo — abrir la app', como: 'CÓMO FUNCIONA', p1: '1. Instala Nimo gratis', p2: '2. Elige un apodo, sin correo ni teléfono', p3: '3. La app abre directo en el mensaje', fora: 'Este mensaje ya no está, pero hay mucha gente en el Muro de Nimo esperando para hablar.', botaoFora: 'Conocer Nimo', idade: 'Solo para mayores de 18 años. El mensaje desaparece en 24 horas.' },
    ru: { gen: 'В Nimo тебя ждёт записка.', deixou: '{nome} оставил(а) записку', botao: 'Ответить в Nimo', ja: 'У меня уже есть Nimo — открыть приложение', como: 'КАК ЭТО РАБОТАЕТ', p1: '1. Установи Nimo бесплатно', p2: '2. Выбери никнейм — без почты и телефона', p3: '3. Приложение сразу откроет записку', fora: 'Эта записка уже снята, но на Стене Nimo много людей ждут общения.', botaoFora: 'Открыть Nimo', idade: 'Только 18+. Записка исчезает через 24 часа.' },
    de: { gen: 'Auf Nimo wartet eine Nachricht auf deine Antwort.', deixou: '{nome} hat eine Nachricht hinterlassen', botao: 'Auf Nimo antworten', ja: 'Ich habe Nimo schon — App öffnen', como: 'SO GEHT’S', p1: '1. Installiere Nimo kostenlos', p2: '2. Wähle einen Spitznamen, ohne E-Mail oder Telefon', p3: '3. Die App öffnet direkt die Nachricht', fora: 'Diese Nachricht ist nicht mehr online, aber auf der Nimo-Pinnwand warten viele Leute auf ein Gespräch.', botaoFora: 'Nimo holen', idade: 'Nur ab 18. Nachrichten verschwinden nach 24 Stunden.' },
    it: { gen: 'Su Nimo c’è un messaggio che aspetta la tua risposta.', deixou: '{nome} ha lasciato un messaggio', botao: 'Rispondi su Nimo', ja: 'Ho già Nimo — apri l’app', como: 'COME FUNZIONA', p1: '1. Installa Nimo gratis', p2: '2. Scegli un nickname, senza email né telefono', p3: '3. L’app si apre direttamente sul messaggio', fora: 'Questo messaggio non è più disponibile, ma sulla Bacheca di Nimo tante persone aspettano di chattare.', botaoFora: 'Scopri Nimo', idade: 'Solo maggiorenni. I messaggi spariscono dopo 24 ore.' },
    tr: { gen: 'Nimo’da cevabını bekleyen bir not var.', deixou: '{nome} bir not bıraktı', botao: 'Nimo’da cevap ver', ja: 'Nimo zaten bende — uygulamayı aç', como: 'NASIL ÇALIŞIR', p1: '1. Nimo’yu ücretsiz yükle', p2: '2. E-posta ya da telefon olmadan bir takma ad seç', p3: '3. Uygulama doğrudan notu açar', fora: 'Bu not artık yayında değil ama Nimo Duvarı’nda sohbet etmek isteyen çok kişi var.', botaoFora: 'Nimo’yu keşfet', idade: 'Sadece 18 yaş ve üzeri. Notlar 24 saatte kaybolur.' },
    ar: { gen: 'هناك رسالة تنتظر ردك على Nimo.', deixou: '{nome} ترك رسالة', botao: 'رد على Nimo', ja: 'لدي Nimo بالفعل — افتح التطبيق', como: 'كيف يعمل', p1: '1. ثبّت Nimo مجانًا', p2: '2. اختر اسمًا مستعارًا، بدون بريد أو هاتف', p3: '3. يفتح التطبيق على الرسالة مباشرة', fora: 'هذه الرسالة لم تعد متاحة، لكن هناك الكثير من الناس على حائط Nimo ينتظرون الحديث.', botaoFora: 'تعرّف على Nimo', idade: 'لمن هم فوق 18 عامًا فقط. تختفي الرسالة بعد 24 ساعة.' },
    he: { gen: 'הודעה מחכה לתשובה שלך ב-Nimo.', deixou: '{nome} השאיר/ה הודעה', botao: 'לענות ב-Nimo', ja: 'כבר יש לי Nimo — לפתוח את האפליקציה', como: 'איך זה עובד', p1: '1. מתקינים את Nimo בחינם', p2: '2. בוחרים כינוי, בלי מייל ובלי טלפון', p3: '3. האפליקציה נפתחת ישר על ההודעה', fora: 'ההודעה הזאת כבר לא באוויר, אבל בלוח של Nimo יש הרבה אנשים שמחכים לדבר.', botaoFora: 'להכיר את Nimo', idade: 'מגיל 18 בלבד. ההודעה נעלמת אחרי 24 שעות.' },
    hi: { gen: 'Nimo पर एक संदेश आपके जवाब का इंतज़ार कर रहा है।', deixou: '{nome} ने एक संदेश छोड़ा', botao: 'Nimo पर जवाब दें', ja: 'मेरे पास Nimo है — ऐप खोलें', como: 'यह कैसे काम करता है', p1: '1. Nimo मुफ़्त में इंस्टॉल करें', p2: '2. ईमेल या फ़ोन के बिना एक उपनाम चुनें', p3: '3. ऐप सीधे संदेश पर खुलता है', fora: 'यह संदेश अब उपलब्ध नहीं है, लेकिन Nimo की दीवार पर बहुत लोग बात करने का इंतज़ार कर रहे हैं।', botaoFora: 'Nimo आज़माएँ', idade: 'केवल 18+ के लिए। संदेश 24 घंटे में गायब हो जाता है।' },
    ja: { gen: 'Nimoであなたの返信を待っているメッセージがあります。', deixou: '{nome}さんがメッセージを残しました', botao: 'Nimoで返信する', ja: 'Nimoを持っています — アプリで開く', como: '使い方', p1: '1. Nimoを無料でインストール', p2: '2. メールや電話番号なしでニックネームを決める', p3: '3. アプリがそのメッセージを直接開きます', fora: 'このメッセージはもう公開されていませんが、Nimoのウォールでは多くの人が話し相手を待っています。', botaoFora: 'Nimoを見てみる', idade: '18歳以上限定。メッセージは24時間で消えます。' },
    ko: { gen: 'Nimo에서 답장을 기다리는 메시지가 있어요.', deixou: '{nome}님이 메시지를 남겼어요', botao: 'Nimo에서 답장하기', ja: '이미 Nimo가 있어요 — 앱 열기', como: '이용 방법', p1: '1. Nimo를 무료로 설치하세요', p2: '2. 이메일이나 전화번호 없이 닉네임을 정하세요', p3: '3. 앱이 바로 그 메시지를 열어요', fora: '이 메시지는 더 이상 게시되어 있지 않지만, Nimo 담벼락에서 많은 사람들이 대화를 기다리고 있어요.', botaoFora: 'Nimo 알아보기', idade: '만 18세 이상만 이용 가능. 메시지는 24시간 후 사라져요.' }
  };
  var idioma = String((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase().split('-')[0];
  if (idioma === 'iw') idioma = 'he';
  var t = T[idioma] || T.en;
  document.documentElement.lang = T[idioma] ? idioma : 'en';
  if (idioma === 'ar' || idioma === 'he') document.documentElement.dir = 'rtl';

  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var codigo = String(q.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

  // O código viaja na instalação (Install Referrer da Play Store); o app lê
  // `convite` e `recado=1` e abre o recado depois do cadastro.
  var referrer = codigo.length === 6 ? encodeURIComponent('convite=' + codigo + '&recado=1') : '';
  var play = 'https://play.google.com/store/apps/details?id=' + PACOTE + (referrer ? '&referrer=' + referrer : '');

  $('texto').textContent = t.gen;
  $('botao').textContent = t.botao;
  $('botao').href = play;
  $('como').textContent = t.como;
  $('p1').textContent = t.p1;
  $('p2').textContent = t.p2;
  $('p3').textContent = t.p3;
  $('idade').textContent = t.idade;

  // Quem já tem o app: abre o Nimo direto (Android). Se o Nimo não estiver
  // instalado ou for antigo, cai na Play Store.
  if (/Android/i.test(navigator.userAgent) && codigo.length === 6) {
    $('ja').textContent = t.ja;
    $('ja').href = 'intent://chatnimo.com/r/?c=' + codigo +
      '#Intent;scheme=https;package=' + PACOTE +
      ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    $('ja').hidden = false;
  }

  function registrar(etapa) {
    try {
      var corpo = JSON.stringify({ etapa: etapa, codigo: codigo });
      var url = BASE + 'registrarClique';
      if (window.fetch) fetch(url, { method: 'POST', body: corpo, mode: 'no-cors', keepalive: true }).catch(function () {});
      else if (navigator.sendBeacon) navigator.sendBeacon(url, corpo);
    } catch (e) {}
  }
  registrar('abriu');
  $('botao').addEventListener('click', function () { registrar('botao'); });
  $('ja').addEventListener('click', function () { registrar('ja_tenho'); });

  if (codigo.length !== 6) return;
  fetch(BASE + 'recadoPublico?c=' + codigo)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ativo && d.text) {
        var nome = String(d.nickname || '').trim();
        if (nome) {
          $('inicial').textContent = Array.from(nome)[0].toUpperCase();
          $('nome').textContent = t.deixou.replace('{nome}', nome);
          $('quem').hidden = false;
        }
        $('texto').textContent = d.text;
      } else {
        $('texto').textContent = t.fora;
        $('texto').className = 'balao fora';
        $('botao').textContent = t.botaoFora;
      }
    })
    .catch(function () { /* fica a frase genérica; o botão funciona igual */ });
})();
</script>
</body>
</html>
